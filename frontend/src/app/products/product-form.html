<section class="page narrow">
  <header class="page-head">
    <h1>{{ isEdit() ? 'Edit product' : 'New product' }}</h1>
  </header>

  @if (error(); as message) {
    <p class="notice notice-error" role="alert">{{ message }}</p>
  }

  <form class="form" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <label class="field">
      <span>Name</span>
      <input type="text" formControlName="name" autocomplete="off" />
      @if (showError('name')) {
        <small class="error">Enter a name of up to 120 characters.</small>
      }
    </label>

    <label class="field">
      <span>SKU</span>
      <input type="text" formControlName="sku" autocomplete="off" />
      @if (showError('sku')) {
        <small class="error">Enter a SKU of up to 40 characters.</small>
      }
    </label>

    <div class="row">
      <label class="field">
        <span>Price (COP)</span>
        <input type="number" formControlName="price" min="0" step="0.01" />
        @if (showError('price')) {
          <small class="error">Enter a price of 0 or more.</small>
        }
      </label>

      <label class="field">
        <span>Stock</span>
        <input type="number" formControlName="stock" min="0" step="1" />
        @if (showError('stock')) {
          <small class="error">Enter a whole number of 0 or more.</small>
        }
      </label>
    </div>

    <label class="field">
      <span>Category</span>
      <select formControlName="categoryId">
        <option [ngValue]="0" disabled>Select a category</option>
        @for (category of categories(); track category.id) {
          <option [ngValue]="category.id">{{ category.name }}</option>
        }
      </select>
      @if (showError('categoryId')) {
        <small class="error">Choose a category.</small>
      }
    </label>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        {{ saving() ? 'Saving…' : 'Save product' }}
      </button>
      <a class="btn" routerLink="/products">Cancel</a>
    </div>
  </form>
</section>
